services:
  # ── PRIMARY (writes go here) ──────────────────────────────
  mysql_primary:
    image: mariadb:11
    container_name: studentsystemgo-mysql-primary
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"   # exposed on host for local debugging via mysql client
    volumes:
      - mysql_primary_data:/var/lib/mysql
      # Schema is now owned by golang-migrate (see internal/dbmigrate/).
      # The app applies migrations at startup against the primary.
      # No schema init.sql mounted here anymore.
      #
      # Replication user creation (runs in primary's binlog history → replica
      # replays it on its own data so the same user exists on both).
      - ./mysql/init/00-replication-user.sql:/docker-entrypoint-initdb.d/00-replication-user.sql:ro
      # Primary-specific config: server-id=1, binlog enabled, GTID
      - ./mysql/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-net

  # ── REPLICA (reads go here) ───────────────────────────────
  # Read-only. Pulls binlog from primary and replays.
  # On first boot, takes ~10-20s to catch up to primary's current state.
  mysql_replica:
    image: mariadb:11
    container_name: studentsystemgo-mysql-replica
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    ports:
      - "3308:3306"   # different host port from primary for local debugging
    volumes:
      - mysql_replica_data:/var/lib/mysql
      # Replica-specific init: CHANGE MASTER + START SLAVE.
      # Runs AFTER MariaDB has created the data dir but before fully ready.
      - ./mysql/init/99-set-up-replication.sql:/docker-entrypoint-initdb.d/99-set-up-replication.sql:ro
      # Replica-specific config: server-id=2, read_only=ON, log_slave_updates
      - ./mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mysql_primary:
        condition: service_healthy
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: studentsystemgo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  # ── RabbitMQ — message broker for async work ──────────────
  # `management` flavor includes the web UI on :15672 — useful for dev
  # debugging (queue lengths, consumers, message rates).
  # alpine variant is ~50MB smaller than full image.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: studentsystemgo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitpass}
      # Enable the built-in Prometheus plugin. Exposes /metrics on :15692.
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_prometheus"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"     # AMQP protocol (clients connect here)
      - "15672:15672"   # Management UI (browser at http://localhost:15672)
      - "15692:15692"   # Prometheus metrics endpoint
    healthcheck:
      # `rabbitmq-diagnostics check_port_connectivity` is fast and reliable.
      # check_running waits for full boot which takes ~20s.
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

  # ── Grafana — dashboards over Prometheus ─────────────────
  # Provisioning files mounted read-only auto-configure datasource + dashboards.
  # Default login: admin / admin (it forces a change on first login;
  # set the env var to skip the prompt).
  grafana:
    image: grafana/grafana:11.3.0
    container_name: studentsystemgo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"   # avoid clash with our app on :3000
    depends_on:
      - prometheus
    networks:
      - app-net

  # ── Prometheus — pull-based metrics collector ─────────────
  # Reads scrape config from monitoring/prometheus/prometheus.yml.
  # Stores time-series in a local volume. Web UI at :9090.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: studentsystemgo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"  # keep 15 days of data
      - "--web.enable-lifecycle"             # allow config reload via HTTP POST
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-net

  # ── Redis exporter ────────────────────────────────────────
  # Translates Redis INFO output into Prometheus format.
  # Runs as a sidecar — talks to redis on the docker network.
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: studentsystemgo-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"   # internal-only; prometheus scrapes here
    depends_on:
      - redis
    networks:
      - app-net

  # ── MariaDB exporters (one per DB) ────────────────────────
  # Reads `SHOW STATUS`, `SHOW VARIABLES`, etc. via SQL.
  # Needs a user with PROCESS, REPLICATION CLIENT, SELECT privileges.
  # We use root for simplicity in dev; prod would use a scoped user.
  mysqld-exporter-primary:
    image: prom/mysqld-exporter:v0.15.1
    container_name: studentsystemgo-mysqld-exporter-primary
    restart: unless-stopped
    command:
      - "--mysqld.address=mysql_primary:3306"
      - "--mysqld.username=root"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_PASSWORD}
    expose:
      - "9104"
    depends_on:
      mysql_primary:
        condition: service_healthy
    networks:
      - app-net

  mysqld-exporter-replica:
    image: prom/mysqld-exporter:v0.15.1
    container_name: studentsystemgo-mysqld-exporter-replica
    restart: unless-stopped
    command:
      - "--mysqld.address=mysql_replica:3306"
      - "--mysqld.username=root"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_PASSWORD}
    expose:
      - "9104"
    depends_on:
      mysql_replica:
        condition: service_healthy
    networks:
      - app-net

  app:
    build: .
    container_name: studentsystemgo-app
    env_file:
      - .env
    environment:
      # Primary (writes) and replica (reads) hostnames.
      DB_PRIMARY_HOST: mysql_primary
      DB_REPLICA_HOST: mysql_replica
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      USE_TLS: "false"
      REDIS_URL: redis://redis:6379
      # RabbitMQ connection. URL format: amqp://user:pass@host:port/
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbit}:${RABBITMQ_PASSWORD:-rabbitpass}@rabbitmq:5672/
      # Photo storage — values come from .env
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      CF_DOMAIN: ${CF_DOMAIN}
      CF_KEY_PAIR_ID: ${CF_KEY_PAIR_ID}
      CF_PRIVATE_KEY_PATH: /etc/secrets/cloudfront_private_key.pem
      # AWS credentials for local dev. On EC2 these are unset and the SDK
      # falls back to the IAM role attached to the instance.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      # CloudFront RSA private key — bind-mount read-only.
      - ./secrets/cloudfront_private_key.pem:/etc/secrets/cloudfront_private_key.pem:ro
      # AWS creds for local dev are passed via .env env vars (see above).
      # Production uses EC2 IAM role; no env vars set there.
    ports:
      - "3000:3000"
    depends_on:
      mysql_primary:
        condition: service_healthy
      mysql_replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-net

  # ── Worker ───────────────────────────────────────────────
  # Same Docker image as the app, but launches the worker binary
  # instead of the HTTP server. Consumes RabbitMQ queues and
  # performs async tasks (sending password-reset emails, etc.).
  #
  # Uses MOCK mailer in dev — emails go to stdout, not real SMTP.
  worker:
    build: .
    container_name: studentsystemgo-worker
    command: ["/app/worker"]   # override default CMD (/app/server)
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbit}:${RABBITMQ_PASSWORD:-rabbitpass}@rabbitmq:5672/
      MAILER_TYPE: mock          # `mock` = log to stdout. Real SMTP comes later.
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:

volumes:
  mysql_primary_data:
  mysql_replica_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
