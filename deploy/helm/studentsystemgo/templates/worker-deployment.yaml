apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "studentsystemgo.fullname" . }}-worker
  labels:
    {{- include "studentsystemgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: studentsystemgo
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studentsystemgo
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      # Init container — wait for RabbitMQ to accept connections.
      # Worker can't do anything without the queue, no point starting.
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for rabbitmq:5672..."
              until nc -z rabbitmq 5672; do
                sleep 2
              done
              echo "RabbitMQ reachable."
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Override the default `/app/server` entrypoint
          command: ["/app/worker"]
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "studentsystemgo.fullname" . }}-rabbitmq
                  key: url
            - name: MAILER_TYPE
              value: {{ .Values.worker.mailerType | quote }}