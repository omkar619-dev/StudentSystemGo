{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "studentsystemgo.fullname" . }}-mysql
  labels:
    {{- include "studentsystemgo.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ required "mysql.rootPassword is required — provide via -f secrets.values.yaml" .Values.mysql.rootPassword | quote }}
  replication-password: {{ required "mysql.replication.password is required" .Values.mysql.replication.password | quote }}
{{- end }}
