apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-replica
  labels:
    {{- include "studentsystemgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql-replica
spec:
  serviceName: mysql-replica
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: studentsystemgo
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mysql-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studentsystemgo
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mysql-replica
    spec:
      # ─── Init container — wait for primary's port 3306 to accept connections ───
      # Replaces Compose's `depends_on: condition: service_healthy`.
      # The replica's first-boot SQL needs to reach primary to set up replication.
      initContainers:
        - name: wait-for-primary
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for mysql-primary:3306 to accept connections..."
              until nc -z mysql-primary 3306; do
                sleep 2
              done
              echo "Primary reachable. Letting MariaDB start."
      containers:
        - name: mariadb
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "studentsystemgo.fullname" . }}-mysql
                  key: root-password
            - name: MARIADB_DATABASE
              value: {{ .Values.mysql.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/replica.cnf
              subPath: replica.cnf
            - name: config
              mountPath: /docker-entrypoint-initdb.d/99-set-up-replication.sql
              subPath: 99-set-up-replication.sql
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mysql.replica.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "studentsystemgo.fullname" . }}-mysql-replica
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.replica.storage }}