apiVersion: v1
kind: Secret
metadata:
  name: {{ include "studentsystemgo.fullname" . }}-cloudfront-key
  labels:
    {{- include "studentsystemgo.labels" . | nindent 4 }}
type: Opaque
stringData:
  # DEV-ONLY: an RSA key generated at helm install time.
  # Used purely to satisfy the photo subsystem's PEM-parse check at startup.
  # NOT used to sign real CloudFront URLs (bucket is dummy in dev).
  # Production: replace with a real CloudFront keypair via --set-file or external Secret.
  cloudfront_private_key.pem: |-
{{ genPrivateKey "rsa" | indent 4 }}