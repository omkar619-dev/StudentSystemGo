apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-primary
  labels:
    {{- include "studentsystemgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql-primary
spec:
  serviceName: mysql-primary    # MUST match the headless Service name
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: studentsystemgo
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mysql-primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studentsystemgo
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mysql-primary
    spec:
      containers:
        - name: mariadb
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "studentsystemgo.fullname" . }}-mysql
                  key: root-password
            - name: MARIADB_DATABASE
              value: {{ .Values.mysql.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/primary.cnf
              subPath: primary.cnf
            - name: config
              mountPath: /docker-entrypoint-initdb.d/00-replication-user.sql
              subPath: 00-replication-user.sql
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mysql.primary.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "studentsystemgo.fullname" . }}-mysql-primary
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.primary.storage }}